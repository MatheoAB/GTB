<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Frontend</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center;
            color: #333;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        form {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        form label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        form input {
            margin-bottom: 15px;
            padding: 10px;
            width: 80%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #dataDisplay {
            margin-top: 20px;
            font-size: 16px;
}
</style>
</head>
<body>

    
    <div class="container">
        <h1>API Frontend - Gestion des Données</h1>
        <button id="loadData">Charger les Données</button>

        <div id="dataDisplay"></div>

        <h2>Ajouter des Données</h2>
        <form id="addDataForm">
            <label for="name">Nom :</label>
            <input type="text" id="name" name="name" required>

            <label for="description">Description :</label>
            <input type="text" id="description" name="description" required>

            <button type="submit">Ajouter</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
